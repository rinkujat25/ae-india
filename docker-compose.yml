# Set explicitly: otherwise Compose names the project after the folder, and two
# stores checked out into same-named folders on one server would be the same
# project, so deploying one would remove the other's container as an orphan.
name: ae-india

services:
  ae-india-nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the prerendered routes; see the Dockerfile. No fallback on
        # purpose: a wrong origin is invisible until it has been shipped.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
        # Empty means no analytics tag at all.
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        # Written with no value on purpose; see the same list under
        # `environment`. Needed here too because the static pages are
        # prerendered, so a run-time value alone would never reach them.
        COMPANY_NAME:
        COMPANY_LEGAL_NAME:
        COMPANY_SUPPORT_EMAIL:
        COMPANY_TOLL_FREE_NUMBER:
        COMPANY_WHATSAPP_NUMBER:
        COMPANY_BUSINESS_HOURS:
        COMPANY_GSTIN:
        COMPANY_ADDRESS:
        COMPANY_STREET_ADDRESS:
        COMPANY_CITY:
        COMPANY_STATE:
        COMPANY_POSTAL_CODE:
        COMPANY_COUNTRY:
    image: ae-india-nextjs:latest
    container_name: ae-india-nextjs
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
      HYPERINVENTORY_API_URL: ${HYPERINVENTORY_API_URL:-https://api.hyperinvento.com/v2}
      # The app throws on every catalogue read without these four, so the deploy
      # stops here instead of starting a store with no products.
      HYPERINVENTORY_SELLER_ID: ${HYPERINVENTORY_SELLER_ID:?set HYPERINVENTORY_SELLER_ID in .env}
      HYPERINVENTORY_SALESCHANNEL: ${HYPERINVENTORY_SALESCHANNEL:?set HYPERINVENTORY_SALESCHANNEL in .env}
      HYPERINVENTORY_CLIENT_ID: ${HYPERINVENTORY_CLIENT_ID:?set HYPERINVENTORY_CLIENT_ID in .env}
      HYPERINVENTORY_CLIENT_SECRET: ${HYPERINVENTORY_CLIENT_SECRET:?set HYPERINVENTORY_CLIENT_SECRET in .env}
      # The provider validates Origin and Referer against the sales channel, so
      # these are the registered storefront's host, aeindia.co, whatever domain
      # this container is served on.
      HYPERINVENTORY_ORIGIN: ${HYPERINVENTORY_ORIGIN:-https://aeindia.co}
      HYPERINVENTORY_REFERER: ${HYPERINVENTORY_REFERER:-https://aeindia.co/}
      HYPERINVENTORY_SEARCH_TOKEN: ${HYPERINVENTORY_SEARCH_TOKEN:-}
      RANKNOVA_API_URL: ${RANKNOVA_API_URL:-}

      # Resend countdown on the OTP verify step; falls back to 60 in code.
      OTP_RESEND_SECONDS: ${OTP_RESEND_SECONDS:-}

      # The company facts behind the footer, the contact page and the JSON-LD.
      #
      # Written with no value on purpose. That form resolves from .env and
      # leaves the variable UNSET when it is absent, where `${VAR:-}` would
      # inject an empty string instead. For COMPANY_WHATSAPP_NUMBER those two
      # are not the same thing: absent falls back to the published number,
      # while present-but-empty takes the WhatsApp button off the site, which
      # is a documented switch in src/lib/company.ts. The rest are written the
      # same way for consistency.
      COMPANY_NAME:
      COMPANY_LEGAL_NAME:
      COMPANY_SUPPORT_EMAIL:
      COMPANY_TOLL_FREE_NUMBER:
      COMPANY_WHATSAPP_NUMBER:
      COMPANY_BUSINESS_HOURS:
      COMPANY_GSTIN:
      COMPANY_ADDRESS:
      COMPANY_STREET_ADDRESS:
      COMPANY_CITY:
      COMPANY_STATE:
      COMPANY_POSTAL_CODE:
      COMPANY_COUNTRY:
    ports:
      # Bound to loopback: nginx is the only thing that should reach the app.
      # 4020, because the Wingback store uses 4010. Change it with APP_PORT.
      - "127.0.0.1:${APP_PORT:-4020}:3000"
    restart: unless-stopped
    # Tini as PID 1, so the health check's processes are reaped and stop is clean.
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      # Next writes its fetch cache here; the rest of the image stays read-only.
      - /app/.next/cache:uid=1001,gid=1001,mode=0755,size=256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
