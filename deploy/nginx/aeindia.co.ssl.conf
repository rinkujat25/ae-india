# Step 2 of 2: HTTPS for aeindia.co, proxied to the container on 127.0.0.1:4020.
# Needs the certificate issued in deploy/README.md, which covers www as well.
server {
    listen 80;
    listen [::]:80;
    server_name aeindia.co www.aeindia.co;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://aeindia.co$request_uri;
    }
}

# www answers only to send visitors to the one canonical host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aeindia.co;

    ssl_certificate /etc/letsencrypt/live/aeindia.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aeindia.co/privkey.pem;

    server_tokens off;

    return 301 https://aeindia.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aeindia.co;

    ssl_certificate /etc/letsencrypt/live/aeindia.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aeindia.co/privkey.pem;

    client_max_body_size 20m;

    # No add_header here. Every security header, HSTS included, is set by Next.js
    # in next.config.ts; repeating one here would send it twice.

    # Keep upstream from leaking server details.
    proxy_hide_header X-Powered-By;
    server_tokens off;

    location / {
        # Rate limiting — enable after adding the zone to nginx.conf's http{} block:
        #   limit_req_zone $binary_remote_addr zone=ae_india_app:10m rate=20r/s;
        # nginx will fail to start if the directives below are uncommented without it.
        # limit_req zone=ae_india_app burst=40 nodelay;
        # limit_req_status 429;

        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
