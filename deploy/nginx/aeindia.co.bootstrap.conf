# Step 1 of 2: port 80 only, so `nginx -t` passes before the certificate exists.
# Replaced by aeindia.co.ssl.conf once certbot has run. See deploy/README.md.
server {
    listen 80;
    listen [::]:80;
    server_name aeindia.co www.aeindia.co;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
