server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    client_max_body_size 20m;

    # HSTS belongs at the TLS terminator. Application headers (CSP, X-Frame-Options,
    # Referrer-Policy, Permissions-Policy) are set by Next.js in next.config.ts so
    # they travel with the app; duplicating them here would emit two of each.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Keep upstream from leaking server details.
    proxy_hide_header X-Powered-By;
    server_tokens off;

    location / {
        # Rate limiting — enable after adding the zone to nginx.conf's http{} block:
        #   limit_req_zone $binary_remote_addr zone=ae_india_app:10m rate=20r/s;
        # nginx will fail to start if the directives below are uncommented without it.
        # limit_req zone=ae_india_app burst=40 nodelay;
        # limit_req_status 429;

        proxy_pass http://127.0.0.1:4020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
